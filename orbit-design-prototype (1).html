<style>

h1{font-size:34px;line-height:1.1;letter-spacing:-1.5px;margin:0 0 9px;font-weight:850}.sub{font-size:14px;color:var(--muted);margin:0;line-height:1.5}

.feature h2{font-size:25px;letter-spacing:-.8px;line-height:1.1;margin:9px 0 7px}.feature p{margin:0;color:#fff1ef;line-height:1.45;max-width:480px}
.feature .secondary{background:#27334f;color:white;border:0;margin-top:14px}.metric-boxes{display:flex;gap:12px}.metric{background:#fff0ed;color:#843f3a;border-radius:12px;padding:17px 18px;min-width:108px;text-align:center}.metric b{display:block;font-size:27px;line-height:1.2}.metric span{font-size:11px;font-weight:700}
.toolbar{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}.search{flex:1;min-width:180px;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px 12px 38px;outline:none;background:white;color:var(--ink)}.search:before{content:"⌕";position:absolute;left:14px;top:7px;font-size:23px;color:#8b92a1}.toolbar select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;color:#4a5265;min-width:125px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:20px 0 17px}.tab{padding:11px 13px;border:0;background:transparent;color:#777f90;font-weight:700;border-bottom:2px solid transparent}.tab.active{color:var(--coral);border-color:var(--coral)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:820px}.card{border:1px solid var(--line);border-radius:13px;background:white;padding:16px;box-shadow:var(--shadow);min-width:0;transition:.16s}.card:hover{border-color:#dedee5;box-shadow:0 6px 18px #1820370c;transform:translateY(-1px)}
.card-head{display:flex;gap:12px;align-items:flex-start}.vote{width:42px;height:42px;border-radius:50%;background:var(--coral);color:white;display:grid;place-items:center;font-size:22px;flex:none}.card h3{font-size:16px;line-height:1.25;margin:0 0 6px;letter-spacing:-.3px}.card p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0 10px;font-size:11px;color:#727b8d}.tag{font-size:10px;font-weight:750;padding:5px 7px;border-radius:5px;background:#fff0ee;color:#bd625e}.tag.blue{background:#eef1ff;color:#5369ce}.tag.green{background:#eaf6f0;color:#57977b}.tag.gold{background:#fff5df;color:#b1812f}.tag.purple{background:#f2edff;color:#805ac5}.card-foot{border-top:1px solid #f0f0f2;padding-top:10px;display:flex;align-items:center;justify-content:space-between;color:#798192;font-size:11px}.social-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;padding-top:10px;border-top:1px solid #f0f0f2}.social-actions button{border:0;background:transparent;color:#737b8d;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:650}.social-actions button:hover{background:#fff0ee;color:#c65d59}.composer{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:11px;align-items:center;margin:18px 0 15px;box-shadow:var(--shadow);max-width:820px}.composer-prompt{flex:1;text-align:left;background:#f7f7f8;border:1px solid #f0f0f2;border-radius:22px;padding:11px 15px;color:#858c9b}.composer-tools{display:flex;gap:7px}.composer-tools button{border:0;background:transparent;color:#657087;font-size:12px;font-weight:700;padding:8px;border-radius:8px}.composer-tools button:hover{background:var(--coral-soft);color:#c65d59}.feed-section{max-width:820px}.feed-label{font-size:12px;font-weight:800;color:#6e778a;margin:18px 0 10px}.post-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}.post-author{font-size:12px;font-weight:750}.post-time{font-size:11px;color:#9298a7;margin-top:2px}.post-more{margin-left:auto;border:0;background:transparent;color:#8b92a1;font-size:20px}.post-content{font-size:14px;line-height:1.65;color:#38425b;margin:0 0 12px}.post-image{width:100%;height:210px;border-radius:10px;object-fit:cover;background:linear-gradient(120deg,#f2c7bb,#e87870);display:grid;place-items:center;color:#fff;font-size:42px;margin:12px 0}.post-tags{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.post-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid #f0f0f2;padding-top:9px;margin-top:10px}.post-actions button{border:0;background:transparent;color:#737b8d;padding:9px 5px;border-radius:8px;font-size:12px;font-weight:700}.post-actions button:hover,.post-actions button.liked{background:#fff0ee;color:#d56560}.person{display:flex;align-items:center;gap:7px}.person .avatar{width:26px;height:26px;font-size:9px}
.right-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:15px;box-shadow:var(--shadow)}.right-card h3{font-size:14px;margin:0 0 14px}.contributor{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f0f0f2;font-size:11px}.contributor:last-child{border:0;padding-bottom:0}.contributor strong{margin-left:auto;color:#c96b63}.rank{font-weight:800;color:#70798c;width:12px}
.legend{display:flex;align-items:center;gap:9px;margin:10px 0;color:#626b7d;font-size:12px}.dot{width:10px;height:10px;border-radius:50%}
.promo{background:#eff8f4;border:1px solid #e4f0ea;border-radius:14px;padding:18px;margin-top:15px}.promo .plane{font-size:30px;color:#57977b}.promo h3{font-size:18px;line-height:1.2;margin:12px 0 8px}.promo p{font-size:12px;color:#718278;line-height:1.5;margin:0}
.list-card{border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:12px;display:flex;gap:14px;box-shadow:var(--shadow)}.list-thumb{width:94px;min-height:94px;border-radius:10px;background:linear-gradient(135deg,#f5b5a8,#e97870);display:grid;place-items:center;color:white;font-size:30px;flex:none}.list-thumb.bluebg{background:linear-gradient(135deg,#9aa9f1,#526ce0)}.list-thumb.greenbg{background:linear-gradient(135deg,#a9d8bf,#57977b)}.list-body{flex:1;min-width:0}.list-body h3{margin:2px 0 7px;font-size:17px}.list-body p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.circle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.circle-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}.circle-cover{height:105px;background:linear-gradient(120deg,#e9a49a,#e96f68);display:flex;align-items:center;justify-content:center;font-size:38px;color:white}.circle-cover.c2{background:linear-gradient(120deg,#a8b4f0,#536be0)}.circle-cover.c3{background:linear-gradient(120deg,#a8d6c0,#57977b)}.circle-cover.c4{background:linear-gradient(120deg,#d6b6ed,#8c65ce)}.circle-info{padding:14px}.circle-info h3{margin:0 0 6px}.circle-info p{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 12px}
.empty-note{padding:30px;text-align:center;color:var(--muted);border:1px dashed #ddd;border-radius:12px}
.modal-backdrop{position:fixed;inset:0;background:#17213f66;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:17px;padding:24px;width:min(520px,100%);box-shadow:0 20px 70px #10182b33}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);font-size:13px;margin:0 0 18px}.modal label{display:block;font-size:12px;font-weight:750;margin:13px 0 6px}.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;outline:none}.modal textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202a45;color:white;padding:11px 17px;border-radius:10px;display:none;z-index:30;box-shadow:0 5px 20px #17213f33}.toast.show{display:block}
@media(max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr)}.right{display:none}.main{padding:28px}}
@media(max-width:700px){.post-image{height:160px}.composer-tools button{font-size:0}.composer-tools button:first-letter{font-size:15px}.app{display:block}.sidebar{height:auto;min-height:0;position:relative;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:5px 8px 12px}.nav-label,.side-bottom,.profile-mini{display:none}.nav-wrap{display:flex;overflow:auto;gap:4px}.nav{width:auto;white-space:nowrap;padding:10px}.nav .count{display:none}.main{padding:24px 15px}.topline{align-items:flex-start;flex-direction:column}.topline .primary{width:100%}h1{font-size:29px}.feature{padding:19px;flex-wrap:wrap}.metric-boxes{width:100%}.metric{flex:1;min-width:0}.grid,.circle-grid{grid-template-columns:1fr}.toolbar select{flex:1}.list-card{padding:12px}.list-thumb{width:72px;min-height:78px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">

</aside>
<main class="main" id="main"></main>
<aside class="right" id="right"></aside>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>Create on Orbit</h2><button class="secondary" onclick="closeModal()">✕</button></div>
  <p>Choose what you want to put into the Orbit community.</p>
  <label>Content type</label><select id="createType"><option>Thought</option><option>Idea</option><option>Knowledge article</option><option>Circle</option></select>

</div></div><div class="toast" id="toast">Draft created — this is a prototype interaction.</div>
<script>
const data={
 ideas:[
  {title:"How can we make remote work feel less isolating?",desc:"Exploring rituals, tools and team habits that help distributed teams feel connected.",cat:"Culture",status:"Trending",votes:842,comments:43,author:"Jamie Scott",initials:"JS",color:"",people:24},
  {title:"A better way to discover what you need to learn",desc:"Can we make learning paths feel more personal, practical and community-driven?",cat:"UX",status:"Open",votes:612,comments:28,author:"Alicia Lee",initials:"AL",color:"blue",people:18},
  {title:"Could local communities share unused resources?",desc:"A collaborative exploration of neighbourhood sharing, trust and circular systems.",cat:"Process",status:"Under review",votes:498,comments:31,author:"Devon Martinez",initials:"DM",color:"gold",people:16},
  {title:"What should a truly useful AI assistant remember?",desc:"Finding the right balance between helpful context, privacy and user control.",cat:"Engineering",status:"Accepted",votes:421,comments:19,author:"Sarah Rodriguez",initials:"SR",color:"purple",people:32}
 ],
 knowledge:[
  {title:"A practical guide to building healthy remote teams",desc:"Research-backed practices for communication, trust and connection in distributed teams.",cat:"Work & Culture",read:"8 min read",author:"Rahul Mehta",initials:"RM",color:"green",source:"Developed from an Idea"},
  {title:"How to think clearly when a problem feels complex",desc:"A framework for breaking ambiguous problems into smaller, testable questions.",cat:"Thinking",read:"6 min read",author:"Alicia Lee",initials:"AL",color:"blue",source:"Independent article"},
  {title:"Designing better habits for lifelong learning",desc:"Small systems that make curiosity, practice and reflection part of everyday life.",cat:"Learning",read:"11 min read",author:"Jamie Scott",initials:"JS",color:"",source:"Developed from an Idea"}
 ],
 thoughts:[

  {title:"Curiosity is a better starting point than certainty.",desc:"Especially when you're trying to solve something with people who see it differently.",author:"Devon Martinez",initials:"DM",color:"gold",time:"1 hr ago",likes:54}
 ]
};
function avatar(initials,color=''){return `<span class="avatar ${color}">${initials}</span>`}
function header(title,sub,button){return `<div class="topline"><div><div class="eyebrow">ORBIT COMMUNITY</div><h1>${title}</h1><p class="sub">${sub}</p></div><button class="primary" onclick="openModal()">＋ ${button}</button></div>`}
function sidePanel(kind){
 let top=`<div class="right-card"><h3>People to follow <span style="float:right;color:var(--blue);font-size:11px">View all</span></h3>
 ${[['JS','Jamie Scott','1.2k',''],['AL','Alicia Lee','982','blue'],['DM','Devon Martinez','876','gold'],['SR','Sarah Rodriguez','765','purple']].map(x=>`<div class="contributor">${avatar(x[0],x[3])}<b>${x[1]}</b><strong>${x[2]}</strong></div>`).join('')}</div>`;
 let legend=`<div class="right-card"><h3>Explore topics</h3>${[['#e66c68','Work & Culture'],['#8b63d9','Technology'],['#3f5ce8','Design & UX'],['#e4aa48','Learning'],['#5aa789','Science']].map(x=>`<div class="legend"><span class="dot" style="background:${x[0]}"></span>${x[1]}</div>`).join('')}</div>`;
 let promo=`<div class="promo"><div class="plane">✧</div><h3>Good ideas grow better together.</h3><p>Bring a question, share what you know, and help the community build something useful.</p><button class="secondary" style="margin-top:13px" onclick="openModal()">Start an idea →</button></div>`;
 if(kind==='Ideas')return `<div class="right-card"><h3>Top contributors <span style="float:right;color:var(--blue);font-size:11px">This week</span></h3>${[['JS','Jamie Scott','1,274',''],['AL','Alicia Lee','982','blue'],['DM','Devon Martinez','876','gold'],['SR','Sarah Rodriguez','765','purple'],['CP','Chloe Patel','642','green']].map(x=>`<div class="contributor"><span class="rank">${['1','2','3','4','5'][[['JS','AL','DM','SR','CP'].indexOf(x[0])] ]}</span>${avatar(x[0],x[3])}<b>${x[1]}</b><strong>${x[2]}</strong></div>`).join('')}</div>${legend}${promo}`;
 if(kind==='Knowledge')return `<div class="right-card"><h3>Knowledge topics</h3>${['Technology','Psychology','Design','Business','Science','Learning'].map((x,i)=>`<div class="legend"><span class="dot" style="background:${['#8b63d9','#e66c68','#3f5ce8','#e4aa48','#5aa789','#9c91b9'][i]}"></span>${x}<span style="margin-left:auto;color:#9aa0ad">›</span></div>`).join('')}</div><div class="right-card"><h3>Recently contributed</h3><div class="contributor">${avatar('RM','green')}<b>Rahul Mehta</b><span style="margin-left:auto;color:var(--muted)">Article</span></div><div class="contributor">${avatar('AL','blue')}<b>Alicia Lee</b><span style="margin-left:auto;color:var(--muted)">Guide</span></div></div>${promo}`;
 if(kind==='Circles')return `<div class="right-card"><h3>Your circles</h3>${['Design Thinkers','Future of Work','Curious Minds'].map((x,i)=>`<div class="contributor"><span class="dot" style="background:${['#e66c68','#3f5ce8','#5aa789'][i]}"></span><b>${x}</b><span style="margin-left:auto;color:var(--muted)">›</span></div>`).join('')}</div>${legend}${promo}`;
 return top+legend+promo;
}
function ideaCard(x){let c=x.cat==='UX'?'blue':x.cat==='Culture'?'gold':x.cat==='Engineering'?'purple':'green';return `<article class="card"><div class="card-head"><div style="text-align:center;flex:none"><div class="vote">↑</div><b style="display:block;color:var(--coral);font-size:22px;margin-top:5px">${x.votes}</b><span style="font-size:10px;color:var(--muted)">upvotes</span></div><div style="min-width:0"><h3>${x.title}</h3><p>${x.desc}</p></div></div><div class="meta"><span class="tag ${c}">${x.cat}</span><span>• ${x.people} contributors</span><span style="color:var(--coral)">◉ ${x.status}</span></div><div class="card-foot"><span class="person">${avatar(x.initials,x.color)}${x.author}</span><span>☏ ${x.comments}</span></div></article>`}
function knowledgeCard(x,i){return `<article class="list-card"><div class="list-thumb ${i===1?'bluebg':i===2?'greenbg':''}">${['▤','✧','⌘'][i%3]}</div><div class="list-body"><div class="meta" style="margin:0 0 5px"><span class="tag blue">${x.cat}</span><span>${x.read}</span></div><h3>${x.title}</h3><p>${x.desc}</p><div class="meta" style="margin:10px 0 0"><span class="person">${avatar(x.initials,x.color)}${x.author}</span><span>·</span><span>${x.source}</span></div></div></article>`}
function thoughtCard(x){return `<article class="card"><div class="person" style="margin-bottom:12px">${avatar(x.initials,x.color)}<b>${x.author}</b><span style="color:var(--muted)">· ${x.time}</span></div><h3 style="font-size:17px">${x.title}</h3><p>${x.desc}</p><div class="card-foot" style="margin-top:14px"><span>♡ ${x.likes} likes</span><span>◌ 12 replies &nbsp; ↗ Share</span></div></article>`}
function render(page='Discover'){
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const main=document.getElementById('main'),right=document.getElementById('right');
 if(page==='Discover'){

function setTab(el,label){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');toast(label+' feed selected')}
function filterCards(q){let cards=document.querySelectorAll('#contentGrid .card,#contentGrid .list-card');cards.forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function setCreateType(type){openModal();document.getElementById('createType').value=type;}
function toggleLike(btn){btn.classList.toggle('liked');btn.textContent=btn.classList.contains('liked')?'♥ Liked':'♡ Like';}
function openModal(){document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function createItem(){let t=document.getElementById('createType').value,title=document.getElementById('createTitle').value.trim();if(!title){toast('Add a title or opening thought first');return}closeModal();document.getElementById('createTitle').value='';document.getElementById('createDesc').value='';toast(t+' draft created in this prototype')}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
